name: CI

# Typecheck, test, and build on every push and PR. The vendored wasm engine
# (web + nodejs targets) is checked into the repo, so this job needs no Rust
# toolchain — exactly what makes the app deployable from a clean checkout.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test (vitest, against the vendored nodejs wasm build)
        run: bun run test

      - name: Build (static export)
        run: bun run build

      - name: Confirm the static export emitted
        run: test -f out/index.html

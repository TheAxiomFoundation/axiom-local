name: Deploy Production

# The gated production path — the ONLY production path. The Vercel git
# integration is for PR previews; git-triggered production builds should be
# skipped via the project's Ignored Build Step, and nobody runs
# `vercel deploy --prod` from a laptop.
#
# Shape (axiom-api's build-once-promote, sized for a static export): the gate
# job re-runs the full CI surface; the deploy job builds once, stages a
# production-env deployment without touching the domain, smokes that exact
# deployment (page present, engine wasm present, golden-path package intact),
# and only then promotes it. Failure before promote leaves production
# untouched; rollback is `vercel rollback`.
#
# Required repo secrets (one-time setup): VERCEL_TOKEN (durable API token —
# ephemeral CLI tokens expire in hours), VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET if deployment protection is on.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: gate · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test (vitest, against the vendored nodejs wasm build)
        run: bun run test

      - name: Build (static export)
        run: bun run build

      - name: Confirm the static export emitted
        run: |
          test -f out/index.html
          test -f out/engine/axiom_rules_engine_wasm_bg.wasm
          test -f out/programs/co-snap/artifact.json
          test -f out/programs/co-snap/package.json

  deploy:
    name: stage · smoke · promote
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Refuse to run without deploy credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID repo secrets are not set — production deploy cannot run. See the header of this workflow."
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the corpus from the locked commit
        # public/corpus/ is gitignored (32MB of YAML), but the graph explorer
        # is advertised on the landing page — production must serve it. The
        # lock file pins exactly which corpus commit ships.
        run: |
          repo=$(python3 -c "import json;print(json.load(open('corpus.lock.json'))['sources'][0]['repo'])")
          commit=$(python3 -c "import json;print(json.load(open('corpus.lock.json'))['sources'][0]['commit'])")
          git init -q .corpus-src
          git -C .corpus-src remote add origin "https://github.com/${repo}.git"
          git -C .corpus-src fetch -q --depth 1 origin "$commit"
          git -C .corpus-src checkout -q FETCH_HEAD
          bun scripts/build-corpus.mjs .corpus-src
          test -f public/corpus/manifest.json
          grep -q "axiom-local.corpus.v1" public/corpus/manifest.json
          # The regenerated lock must match the committed one — otherwise the
          # checkout is not the corpus that was reviewed.
          git diff --exit-code corpus.lock.json

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel build --prod --token "$VERCEL_TOKEN"

      - name: Stage the production deployment (domain untouched)
        id: stage
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(bunx vercel deploy --prebuilt --prod --skip-domain --token "$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged: $url"

      - name: Smoke the staged deployment
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          url="${{ steps.stage.outputs.url }}"
          hdr=()
          if [ -n "$BYPASS" ]; then hdr=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          curl -fsS "${hdr[@]}" "$url/local/" | grep -q "Axiom local"
          curl -fsS "${hdr[@]}" -o /dev/null "$url/local/engine/axiom_rules_engine_wasm_bg.wasm"
          # The corpus explorer must be alive on the staged deployment.
          curl -fsS "${hdr[@]}" "$url/local/corpus/manifest.json" | head -c 200 | grep -q "axiom-local.corpus.v1"
          # The golden-path package must arrive intact: same sha-256 the
          # descriptor pins, so the page's provenance line shows "= pinned".
          pinned=$(python3 -c "import json;print(json.load(open('public/programs/co-snap/package.json'))['source']['artifact_sha256'])")
          served=$(curl -fsS "${hdr[@]}" "$url/local/programs/co-snap/artifact.json" | shasum -a 256 | cut -d' ' -f1)
          if [ "$pinned" != "$served" ]; then
            echo "::error::Served artifact sha-256 ($served) does not match the descriptor pin ($pinned)"
            exit 1
          fi

      - name: Promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: bunx vercel promote "${{ steps.stage.outputs.url }}" --token "$VERCEL_TOKEN"

      - name: Smoke production
        env:
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # Repo variable PRODUCTION_URL overrides; the fallback is the
          # current Vercel project domain (project not yet renamed from
          # axiom-playground — update the variable when it is).
          PROD_URL: ${{ vars.PRODUCTION_URL || 'https://axiom-playground.vercel.app' }}
        run: |
          hdr=()
          if [ -n "$BYPASS" ]; then hdr=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          # The domain alias can lag the promote by a few seconds — retry
          # before declaring production broken.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS "${hdr[@]}" "$PROD_URL/local/" | grep -q "Axiom local"; then exit 0; fi
            echo "attempt $attempt: production not serving yet, retrying in 10s"
            sleep 10
          done
          echo "::error::$PROD_URL never served the promoted deployment"
          exit 1
